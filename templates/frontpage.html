<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Qrcode Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>
        <p>Enter a URL to generate its QR code</p>
        <form method="POST">
            <h2>URL to QR Code</h2>
            <input
                type = "text"
                name = "url"
                placeholder="Enter URL"
                required
            >
            <br>
            <br>
            <button type="submit">Generator qr</button>
        </form>

        {% if qr_image %}
            <h3>Your QR Code:</h3>
            <img src="{{qr_image}}" alt="QR Code">
        {% endif %}
    </div>

</body>
</html>
